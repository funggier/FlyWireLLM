[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flywire-llm"
version = "0.2.0"
description = "Training-ready language model foundation with a qualified research pretraining corpus and frozen lineage"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
dependencies = [
  "torch>=2.14,<2.15"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3"
]
tokenizer = [
  "sentencepiece==0.2.2"
]
data = [
  "duckdb==1.5.6",
  "pyarrow==25.0.1",
  "wikiextractor==3.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
